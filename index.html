<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація у Фітнес-AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-container">
        <h2 id="form-title">Реєстрація (Крок 1/2)</h2>
        <p id="error-message" class="error-text"></p>

        <form id="register-form">
            
            <div id="step-1" class="form-step active">
                <div class="input-group">
                    <label for="displayName">Ваше ім'я</label>
                    <input type="text" id="displayName" placeholder="Вікторія" required>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="example@gmail.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="button" id="btn-next" class="btn-main">Далі (Параметри тіла) →</button>
            </div>

            <div id="step-2" class="form-step">
                <div class="input-group">
                    <label for="birthDate">Дата народження</label>
                    <input type="date" id="birthDate" required>
                </div>

                <div class="input-group">
                    <label for="gender">Стать</label>
                    <select id="gender">
                        <option value="male">Чоловіча</option>
                        <option value="female">Жіноча</option>
                        <option value="other">Інша</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="weight">Вага (кг)</label>
                    <input type="number" id="weight" placeholder="70" min="30" max="300" step="0.1" required>
                </div>

                <div class="input-group">
                    <label for="height">Зріст (см)</label>
                    <input type="number" id="height" placeholder="175" min="100" max="250" required>
                </div>

                <div class="btn-group">
                    <button type="button" id="btn-back" class="btn-secondary">← Назад</button>
                    <button type="submit" id="btn-submit" class="btn-success">Створити акаунт 🚀</button>
                </div>
            </div>

        </form>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
