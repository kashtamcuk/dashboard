<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд | AI Фітнес</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="logo">AI-Sport</div>
            <nav>
                <a href="#" class="nav-item active">🏠 Головна</a>
                <a href="map.html" class="nav-item">🗺️ Карта & GPS</a>
                <a href="#" class="nav-item">🎵 Музика</a>
                <a href="#" class="nav-item">🏆 Досягнення</a>
            </nav>
        </aside>

        <main class="main-content">

            <section class="ai-assistant-card">
                <div class="card ai-trainer-card">
                    <h2>Ваш AI Трейнер</h2>
                    
                    <p id="ai-advice-text" style="font-size: 1.1rem; line-height: 1.6; color: #fff;">
                        Завантаження порад тренера...
                    </p>

                    <div id="ai-response" class="ai-content" style="margin-top: 15px;">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                    </div>
                </div>
            </section>

           <div class="card card-calories">
                <h3>🔥 Спалені калорії</h3>
                <div class="calories-counter">
                    <span id="calories-burned">0</span> / 2100 ккал
                </div>
                <div class="progress-bar-container">
                    <div id="calories-progress-fill" style="width: 0%; height: 8px; background: #ff4500; transition: width 0.5s ease;"></div>
                </div>
                <span id="calories-percent">0%</span>
            </div>
                
                
                <div class="stat-card water-card">
                    <h4>💧 Водний трекер</h4>
                    <p class="water-display">
                        <span id="water-current">0</span> / <span id="water-target">2.5</span> л
                    </p>
                    
                    <div class="water-progress-bar">
                        <div id="water-progress-fill" style="width: 0%;"></div>
                    </div>

                    <div class="water-buttons">
                        <button class="btn-water" data-amount="0.1">+100 мл</button>
                        <button class="btn-water" data-amount="0.25">+250 мл</button>
                        <button class="btn-water" data-amount="0.5">+500 мл</button>
                        <button class="btn-water-reset" id="btn-water-reset" style="background: none; border: none; cursor: pointer; font-size: 0.9rem; color: #aaa;">🔄 Скинути</button>
                    </div>

                    <div class="ai-water-reminder">
                        <p id="ai-water-text">🤖 AI: Завантаження рекомендацій...</p>
                    </div>
                </div>


            </div>
        </main>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
